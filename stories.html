<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stories — Understanding the Himalayans</title>
<meta name="description" content="Understanding the Himalayans — community stories, disaster experiences and place-based documentation.">
<script>
try{
  const t=localStorage.getItem("himalayans-theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme=t;
}catch(e){}
</script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div data-site-header></div>

<main>
<section class="page-hero"><div class="container"><span class="eyebrow">Archive</span><h1>Stories</h1><p>Explore documented experiences by the places and disasters actually represented in the collection.</p></div></section>
<section class="section reveal"><div class="container">
  <div class="filter-box">
    <div class="filter-grid">
      <label>Province<select id="province"></select></label>
      <label>District<select id="district"></select></label>
      <label>Place<select id="place"></select></label>
      <label>Disaster type<select id="disaster"></select></label>
      <label>Year<select id="year"></select></label>
      <label>Search<input id="search" type="search" placeholder="Search stories..."></label>
    </div>
    <div class="filter-actions"><span id="resultCount">0 stories</span><button id="reset" class="btn secondary">Reset filters</button></div>
  </div>
  <div id="storiesGrid" class="story-grid"></div>
</div></section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<div data-site-footer></div>
<script src="js/js_main/data.js"></script>
<script src="js/js_main/filters.js"></script>
<script src="js/js_main/common.js"></script>
<script src="js/js_main/stories.js"></script>
</body></html>
